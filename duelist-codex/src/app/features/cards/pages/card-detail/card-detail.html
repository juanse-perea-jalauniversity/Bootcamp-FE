<div class="detail-page">
  <a class="back" routerLink="/">← Back to catalog</a>

  @if (card(); as card) {
    <card-detail-header [card]="card" />

    <nav class="tab-bar">
      <a routerLink="effect"     routerLinkActive="active">Effect</a>
      <a routerLink="statistics" routerLinkActive="active">Statistics</a>
      <a routerLink="prices"     routerLinkActive="active">Prices</a>
    </nav>

    <router-outlet />

    @defer (on interaction) {
      <card-printings [printings]="card.card_sets ?? []" />
    } @placeholder {
      <p class="printings-status">Scroll to load the printings of this card</p>
    } @loading (minimum 3000ms) {
      <p class="printings-status">Loading printings…</p>
    }
  } @else {
    <div class="not-found">
      <p>Card not found.</p>
      <a routerLink="/">Return to catalog</a>
    </div>
  }
</div>
