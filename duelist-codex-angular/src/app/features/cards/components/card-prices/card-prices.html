@if (card().card_prices?.[0]; as price) {
  <ul class="stats">
    <li><span>Cardmarket</span><strong>{{ price.cardmarket_price | cardPrice: 'EUR' }}</strong></li>
    <li><span>TCGplayer</span><strong>{{ price.tcgplayer_price | cardPrice: 'USD' }}</strong></li>
    <li><span>eBay</span><strong>{{ price.ebay_price | cardPrice: 'USD' }}</strong></li>
  </ul>
} @else {
  <p class="muted">No price data available.</p>
}
